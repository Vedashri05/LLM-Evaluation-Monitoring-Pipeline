name: LLM Eval Gate

on:
  pull_request:
    paths:
      - "prompts/**"
      - "knowledge_base/**"
      - "app/**"
      - "evals/**"
      - "golden_dataset.jsonl"
      - "config.yaml"
  push:
    branches: [main]
    paths:
      - "prompts/**"
      - "knowledge_base/**"
      - "app/**"
      - "evals/**"
      - "golden_dataset.jsonl"
      - "config.yaml"
  workflow_dispatch:

permissions:
  contents: write        # commit results/history.jsonl on main
  pull-requests: write   # post the PR comment

concurrency:
  group: llm-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate golden dataset
        run: python scripts/validate_dataset.py

      # Exits 1 if any threshold/regression check fails.
      # Make this job a *required status check* in branch protection to block merges.
      - name: Run LLM evaluation
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "push" ]; then FLAGS="--record"; fi
          python -m evals.run_eval $FLAGS
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('results/report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('results/report.md', 'utf8');
            const marker = '<!-- llm-eval-gate -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const old = comments.find(c => c.body.includes(marker));
            const payload = { owner: context.repo.owner, repo: context.repo.repo, body: marker + '\n' + body };
            if (old) await github.rest.issues.updateComment({ ...payload, comment_id: old.id });
            else await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number });

      - name: Commit metrics history (main only)
        if: success() && github.event_name == 'push'
        run: |
          git config user.name  "llm-eval-bot"
          git config user.email "llm-eval-bot@users.noreply.github.com"
          git add results/history.jsonl
          git diff --cached --quiet || (git commit -m "chore: record eval run [skip ci]" && git push)
